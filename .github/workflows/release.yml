# The release workflow (docs/release.md, docs/distribution.md "Release pipeline").
#
#   git tag v0.1.0 && git push origin v0.1.0     builds, packages, drafts a release
#   Actions > release > Run workflow             builds and packages; no release
#
# Secret: ALETHEIA_TOKEN, a token that can read the private aletheia
# repository (docs/release.md says how to make it).  The workflow ends with a
# DRAFT release.  A person reviews it and publishes it.
#
# Runners: GitHub-hosted by default.  To use the self-hosted runner that
# docs/release.md describes, set the repository variable EIDOS_RUNNER_WINDOWS
# to a JSON array such as ["self-hosted","windows"].

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Also make a draft release (tag name v<version>-test)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The relay the release builds talk to by default.  Empty: none.
  EIDOS_DEFAULT_RELAY: ${{ vars.EIDOS_DEFAULT_RELAY }}
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
  LINUXDEPLOY_SHA256: 4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a

jobs:
  meta:
    name: version and pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.m.outputs.version }}
      pin: ${{ steps.m.outputs.pin }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        shell: bash
        run: |
          version=$(sed -n 's/^project(eidos VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          pin=$(sed -n 's/^set(EIDOS_ALETHEIA_PIN "\([0-9a-f]*\)").*/\1/p' cmake/aletheia_pin.cmake)
          [ -n "$version" ] && [ -n "$pin" ] || { echo "cannot read version or pin"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version ${version}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "eidos $version, aletheia $pin"

  # ---------------------------------------------------------------- Windows
  windows:
    name: windows
    needs: meta
    runs-on: ${{ fromJSON(vars.EIDOS_RUNNER_WINDOWS || '["windows-2022"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      EIDOS_SDL_CACHE: ${{ github.workspace }}/.cache/sdl
      EIDOS_WAMR_CACHE: ${{ github.workspace }}/.cache/wamr
      EIDOS_MBEDTLS_CACHE: ${{ github.workspace }}/.cache/mbedtls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Project-Holon/aletheia
          ref: ${{ needs.meta.outputs.pin }}
          token: ${{ secrets.ALETHEIA_TOKEN || github.token }}
          path: aletheia
      # 32-bit MinGW-w64: the game builds for 32-bit pointers (docs/pointer-width.md).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-python
            zip
            unzip
      - uses: actions/cache@v4
        with:
          path: .cache
          key: deps-windows-${{ hashFiles('tools/fetch_sdl.py', 'tools/fetch_wamr.py', 'tools/fetch_mbedtls.py') }}
      # The compiler the release is tested with, not MSYS2's newest: the
      # same xPack GCC 14.2 build the port is developed and played on.
      # MSYS2's GCC 16 builds a test_mod_wasm that crashes (2026-10-23).
      - name: Compiler (xPack MinGW-w64 GCC 14.2.0-1, checked against its SHA-256)
        run: |
          zip=xpack-mingw-w64-gcc-14.2.0-1-win32-x64.zip
          mkdir -p .cache/gcc
          if [ ! -d .cache/gcc/xpack-mingw-w64-gcc-14.2.0-1 ]; then
            curl -sSfL -o "$zip" \
              "https://github.com/xpack-dev-tools/mingw-w64-gcc-xpack/releases/download/v14.2.0-1/$zip"
            echo "d9f73bb51ada5ae0ac49277c91815ee0334c8096614d6ced1828fd864712ce73  $zip" | sha256sum -c -
            unzip -q "$zip" -d .cache/gcc
            rm "$zip"
          fi
          .cache/gcc/xpack-mingw-w64-gcc-14.2.0-1/bin/i686-w64-mingw32-gcc --version | head -1
      - name: Fetch SDL2, WAMR, Mbed TLS (each is checked against a recorded SHA-256)
        run: |
          python tools/fetch_sdl.py --flavor mingw
          python tools/fetch_wamr.py
          python tools/fetch_mbedtls.py
      - name: Stand-ins for the few ROM bytes the sources include (docs/release.md)
        run: python tools/package_release.py placeholders --aletheia-root aletheia
      # The flags of the build players test with: the game's C relies on
      # wrapping arithmetic and loose aliasing, as the DS compiler gave it.
      - name: Configure
        run: |
          gcc_bin="$(cygpath -m "$PWD/.cache/gcc/xpack-mingw-w64-gcc-14.2.0-1/bin")"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ilp32-toolchain.cmake \
            -DCMAKE_C_COMPILER="$gcc_bin/i686-w64-mingw32-gcc.exe" \
            -DCMAKE_RC_COMPILER="$gcc_bin/i686-w64-mingw32-windres.exe" \
            -DCMAKE_C_FLAGS="-O2 -fno-strict-aliasing -fwrapv -fno-delete-null-pointer-checks -fno-omit-frame-pointer" \
            -DALETHEIA_ROOT="$(cygpath -m "$PWD/aletheia")" \
            -DBW_DATA_ROOT="$(cygpath -m "$PWD/no-game-data/extract/data")" \
            -DEIDOS_BOOT=ON -DEIDOS_OVERLAYS=ALL \
            -DEIDOS_RELEASE=ON \
            -DEIDOS_DEFAULT_RELAY="$EIDOS_DEFAULT_RELAY"
      - name: Build
        run: cmake --build build
      - name: Test (no ROM; tests that need one skip themselves)
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Package
        run: |
          python tools/package_release.py windows --build-dir build --version "${{ needs.meta.outputs.version }}" --out dist
          # a name without the version, for .../releases/latest/download/
          cp "dist/eidos-${{ needs.meta.outputs.version }}-windows.zip" dist/eidos-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  linux:
    name: linux
    needs: meta
    # The game builds only with 32-bit pointers for now (docs/lp64.md); a
    # 64-bit Linux build waits on that.  Set the repository variable
    # EIDOS_BUILD_64BIT to true to try it.
    if: vars.EIDOS_BUILD_64BIT == 'true'
    runs-on: ubuntu-22.04     # the oldest glibc we ship against
    timeout-minutes: 60
    env:
      EIDOS_WAMR_CACHE: ${{ github.workspace }}/.cache/wamr
      EIDOS_MBEDTLS_CACHE: ${{ github.workspace }}/.cache/mbedtls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Project-Holon/aletheia
          ref: ${{ needs.meta.outputs.pin }}
          token: ${{ secrets.ALETHEIA_TOKEN || github.token }}
          path: aletheia
      # Cached after the first good run, so a slow package mirror does not
      # hold the job; the cache keys on the package list and version.
      - name: Packages
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: ninja-build libsdl2-dev libgl1-mesa-dev libfuse2 file
          version: "1"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: deps-linux-${{ hashFiles('tools/fetch_wamr.py', 'tools/fetch_mbedtls.py') }}
      - name: Fetch WAMR and Mbed TLS (each is checked against a recorded SHA-256)
        run: |
          python3 tools/fetch_wamr.py
          python3 tools/fetch_mbedtls.py
      - name: Stand-ins for the few ROM bytes the sources include (docs/release.md)
        run: python3 tools/package_release.py placeholders --aletheia-root aletheia
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_FLAGS="-O2 -fno-strict-aliasing -fwrapv -fno-delete-null-pointer-checks -fno-omit-frame-pointer" \
            -DALETHEIA_ROOT="$PWD/aletheia" \
            -DBW_DATA_ROOT="$PWD/no-game-data/extract/data" \
            -DEIDOS_BOOT=ON -DEIDOS_OVERLAYS=ALL \
            -DEIDOS_RELEASE=ON \
            -DEIDOS_DEFAULT_RELAY="$EIDOS_DEFAULT_RELAY"
      - name: Build
        run: cmake --build build
      - name: Test (no ROM; tests that need one skip themselves)
        run: ctest --test-dir build --output-on-failure -j 4
      - name: linuxdeploy (pinned, checked)
        run: |
          curl -sSL -o linuxdeploy "$LINUXDEPLOY_URL"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
      - name: Package
        run: python3 tools/package_release.py linux --build-dir build --version "${{ needs.meta.outputs.version }}" --out dist --linuxdeploy "$PWD/linuxdeploy"
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/*.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos:
    name: macos
    needs: meta
    # macOS has no 32-bit programs: it waits on the 64-bit build, as Linux.
    if: vars.EIDOS_BUILD_64BIT == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      EIDOS_WAMR_CACHE: ${{ github.workspace }}/.cache/wamr
      EIDOS_MBEDTLS_CACHE: ${{ github.workspace }}/.cache/mbedtls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Project-Holon/aletheia
          ref: ${{ needs.meta.outputs.pin }}
          token: ${{ secrets.ALETHEIA_TOKEN || github.token }}
          path: aletheia
      - name: Packages
        timeout-minutes: 15
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ninja sdl2
      - uses: actions/cache@v4
        with:
          path: .cache
          key: deps-macos-${{ hashFiles('tools/fetch_wamr.py', 'tools/fetch_mbedtls.py') }}
      - name: Fetch WAMR and Mbed TLS (each is checked against a recorded SHA-256)
        run: |
          python3 tools/fetch_wamr.py
          python3 tools/fetch_mbedtls.py
      - name: Stand-ins for the few ROM bytes the sources include (docs/release.md)
        run: python3 tools/package_release.py placeholders --aletheia-root aletheia
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_FLAGS="-O2 -fno-strict-aliasing -fwrapv -fno-delete-null-pointer-checks -fno-omit-frame-pointer" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DALETHEIA_ROOT="$PWD/aletheia" \
            -DBW_DATA_ROOT="$PWD/no-game-data/extract/data" \
            -DEIDOS_BOOT=ON -DEIDOS_OVERLAYS=ALL \
            -DEIDOS_RELEASE=ON \
            -DEIDOS_DEFAULT_RELAY="$EIDOS_DEFAULT_RELAY"
      - name: Build
        run: cmake --build build
      - name: Test (no ROM; tests that need one skip themselves)
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Package
        run: python3 tools/package_release.py macos --build-dir build --version "${{ needs.meta.outputs.version }}" --out dist --lib "$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*.zip
          if-no-files-found: error

  # --------------------------------------------------------------- Launcher
  launcher:
    name: launcher (windows)
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      # The launcher carries the release's version (its page shows it and
      # the installer is named with it): set in the three files that hold it.
      - name: The release's version
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["launcher/package.json", "launcher/src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }'
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" launcher/src-tauri/Cargo.toml
          grep -m1 '^version' launcher/src-tauri/Cargo.toml
      - name: Build the installer
        working-directory: launcher
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          npm ci
          npx tauri build --bundles nsis
      - name: Name it
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p out
          cp launcher/src-tauri/target/release/bundle/nsis/*-setup.exe \
             "out/eidos-launcher-${VERSION}-windows-setup.exe"
          # the same file under a name without the version: the website's
          # download button points at .../releases/latest/download/<this>,
          # which always gives the newest release
          cp "out/eidos-launcher-${VERSION}-windows-setup.exe" \
             out/eidos-launcher-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: draft release
    needs: [meta, windows, linux, macos, launcher]
    if: >-
      !cancelled() && needs.windows.result == 'success' &&
      needs.launcher.result == 'success' &&
      (github.ref_type == 'tag' || inputs.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum eidos-* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          python3 tools/package_release.py --self-test
          {
            echo "> eidos is an unofficial fan project. It is not affiliated with or"
            echo "> endorsed by Nintendo, Game Freak, Creatures Inc. or The Pokemon Company."
            echo "> It contains no game data: you need your own legally obtained copy of"
            echo "> Pokemon Black or White. Pokemon and Nintendo DS are trademarks of their"
            echo "> respective owners."
            echo
            echo "Install the launcher (eidos-launcher-...-setup.exe) and press Play, or"
            echo "unzip the game (eidos-...-windows.zip) anywhere and run \`eidos\`. On the"
            echo "first start, pick your own Pokemon Black ROM."
            echo
            echo "The macOS build is not signed. If macOS refuses to open it, run"
            echo "\`xattr -dr com.apple.quarantine .\` in the unzipped folder, or right-click"
            echo "the file and choose Open."
            echo
            echo "SHA-256 of every file is in \`SHA256SUMS\`."
          } > notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"; target=""
          else
            tag="v${VERSION}-test"; target="--target ${GITHUB_SHA}"
          fi
          gh release create "$tag" dist/* --draft --title "eidos ${VERSION}" \
            --notes-file notes.md $target
